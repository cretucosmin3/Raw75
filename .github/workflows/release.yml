name: Release

# Releases are built only when a version tag is pushed (git tag v0.2.2 && git push origin v0.2.2).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  check:
    name: Check tag matches version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Raw75
        uses: actions/checkout@v4

      # The tag must be vX.Y.Z and equal the project's <Version>, so the release holds the version it is named after.
      - name: Compare tag and <Version>
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION=$(grep -oPm1 "(?<=<Version>)[^<]+" src/Raw75/Raw75.csproj || true)
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $TAG is not of the form vX.Y.Z."
            exit 1
          fi
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "::error::Tag $TAG does not match <Version>$VERSION</Version> in src/Raw75/Raw75.csproj."
            exit 1
          fi

  build:
    name: Build ${{ matrix.rid }}
    needs: check
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            archive_ext: tar.gz
          - os: windows-latest
            rid: win-x64
            archive_ext: zip
          - os: macos-latest
            rid: osx-arm64
            archive_ext: tar.gz
          - os: macos-15-intel
            rid: osx-x64
            archive_ext: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Raw75
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install macOS Dependencies
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install libraw

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Raw75 (${{ matrix.rid }})
        run: >
          dotnet publish src/Raw75/Raw75.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -o ./publish/Raw75-${{ matrix.rid }}

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          chmod +x ./publish/Raw75-${{ matrix.rid }}/Raw75
          tar -czvf Raw75-${{ matrix.rid }}.tar.gz -C ./publish Raw75-${{ matrix.rid }}

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Compress-Archive -Path ./publish/Raw75-${{ matrix.rid }} -DestinationPath Raw75-${{ matrix.rid }}.zip

      - name: Package (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          BREW_PREFIX=$(brew --prefix)
          cp -L "$BREW_PREFIX"/lib/libraw*.dylib ./publish/Raw75-${{ matrix.rid }}/ 2>/dev/null || true
          cp -L "$BREW_PREFIX"/lib/liblcms2*.dylib ./publish/Raw75-${{ matrix.rid }}/ 2>/dev/null || true
          cp -L "$BREW_PREFIX"/lib/libjpeg*.dylib ./publish/Raw75-${{ matrix.rid }}/ 2>/dev/null || true
          chmod +x ./publish/Raw75-${{ matrix.rid }}/Raw75
          tar -czvf Raw75-${{ matrix.rid }}.tar.gz -C ./publish Raw75-${{ matrix.rid }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Raw75-${{ matrix.rid }}
          path: Raw75-${{ matrix.rid }}.${{ matrix.archive_ext }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
